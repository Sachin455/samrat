{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Create account</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>User ID
      <input name="user_id" value="{{ user_id }}" required autofocus autocomplete="username"
             pattern="[A-Za-z0-9_.\-]{3,32}" title="3-32 letters, numbers, '.', '_' or '-'">
      <small>Unique ID others will use to send you transactions (3–32 letters, numbers, . _ -).</small>
    </label>
    <label>Password <input type="password" name="password" required minlength="6" autocomplete="new-password"></label>
    <label>Confirm password <input type="password" name="confirm" required minlength="6" autocomplete="new-password"></label>
    <button type="submit">Create account</button>
  </form>
  <p class="muted">Already registered? <a href="{{ url_for('login') }}">Log in</a>.</p>
</section>
{% endblock %}
